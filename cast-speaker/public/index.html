<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スピーカーリモコン</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c1e21;--sub:#6b7280;--ac:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#eceef2;--sub:#9aa1ad;--ac:#6ea0ff;--bd:#2c313b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif;padding:16px;padding-bottom:40px}
h1{font-size:20px;margin:0 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600}
select,button,input[type=password]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
select{width:100%}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.file{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}.file:first-child{border-top:0}
.file .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file button{flex:none;padding:8px 14px}
input[type=range]{width:100%}#msg{position:fixed;left:16px;right:16px;bottom:16px;background:#111;color:#fff;padding:12px;border-radius:12px;display:none;text-align:center}
.sub{color:var(--sub);font-size:13px}
</style></head><body>
<h1>🔊 スピーカーリモコン</h1>

<div class="card"><h2>🐶 ワンタップ</h2>
  <button class="p" id="calm" style="width:100%;font-size:20px;padding:18px">🐶 落ち着かせる</button>
  <div class="sub" id="calmnote" style="margin-top:6px"></div>
  <div class="row" style="margin-top:8px"><label class="sub" style="flex:none">自動で止める</label>
  <select id="tmr"><option value="0">止めない</option><option value="10">10分</option><option value="30" selected>30分</option><option value="60">60分</option><option value="120">2時間</option></select></div>
  <div class="sub">下のファイル一覧の ★ で「落ち着く音」を選びます(飼い主さんの声・ゆったりした音楽など)。ループ再生・音量は下の設定が使われます。</div>
</div>

<div class="card"><h2>スピーカー</h2>
  <select id="dev"></select>
  <div class="row" style="margin-top:8px"><button id="rescan">再検索</button></div>
  <div class="sub" id="devnote"></div>
</div>

<div class="card"><h2>コントロール</h2>
  <div class="sub" id="now">停止中</div>
  <div class="row" style="margin:8px 0"><button id="pause">⏸ 一時停止</button><button id="resume">▶ 再開</button><button id="stop">⏹ 停止</button></div>
  <label class="sub">音量 <span id="vl">50</span>%</label>
  <input type="range" id="vol" min="0" max="100" value="50">
  <label class="row" style="margin-top:6px"><input type="checkbox" id="loop" style="flex:none"> <span>ループ再生</span></label>
</div>

<div class="card"><h2>音声ファイルを追加</h2>
  <input type="file" id="up" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac,.opus" multiple>
  <div class="row" style="margin-top:8px"><button class="p" id="upbtn">アップロード</button></div>
</div>

<div class="card"><h2>ファイル (タップで再生)</h2><div id="files" class="sub">読み込み中…</div></div>

<div class="card"><h2>合言葉 (設定している場合のみ)</h2><input type="password" id="tok" placeholder="TOKEN"></div>
<div id="msg"></div>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('tok')||'';$('tok').value=token;
$('tok').onchange=()=>{token=$('tok').value;localStorage.setItem('tok',token);init()};
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
async function api(p,opt={}){
  opt.headers=Object.assign({'x-token':token},opt.headers||{});
  if(opt.body&&!(opt.body instanceof FormData)){opt.headers['content-type']='application/json';opt.body=JSON.stringify(opt.body)}
  const r=await fetch('/api/'+p,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('エラー '+r.status));return j;
}
const dev=()=>$('dev').value;
async function loadDevices(){
  const d=await api('devices');const cur=localStorage.getItem('dev');
  $('dev').innerHTML=d.map(x=>`<option value="${x.id}">${x.name}${x.model?' ('+x.model+')':''}</option>`).join('');
  if(cur&&d.some(x=>x.id===cur))$('dev').value=cur;
  $('devnote').textContent=d.length?'':'見つかりません。スマホとスピーカーが同じWi-Fiか確認し「再検索」を押してください';
}
$('dev').onchange=()=>localStorage.setItem('dev',dev());
$('rescan').onclick=async()=>{await api('rescan',{method:'POST'});toast('検索中…');setTimeout(loadDevices,3000)};
async function loadFiles(){
  const f=await api('files');
  $('calmnote').textContent=fav()?'再生: '+fav():'まだ選んでいません';
  $('files').innerHTML=f.length?'':'まだありません。上から追加してください';
  f.forEach(x=>{const d=document.createElement('div');d.className='file';
    d.innerHTML=`<span class="n"></span><button>☆</button><button class="p">▶</button><button>🗑</button>`;
    d.querySelector('.n').textContent=x.name;
    const star=d.children[1];if(fav()===x.name)star.textContent='★';
    star.onclick=()=>{localStorage.setItem('fav',x.name);loadFiles()};
    d.children[2].onclick=()=>play(x.name);
    d.children[3].onclick=async()=>{if(confirm(x.name+' を削除?')){await api('files/'+encodeURIComponent(x.name),{method:'DELETE'});loadFiles()}};
    $('files').appendChild(d)});
}
const fav=()=>localStorage.getItem('fav')||'';
$('calm').onclick=()=>{if(!fav())return toast('★で落ち着く音を選んでください');$('loop').checked=true;play(fav())};
async function play(name){
  if(!dev())return toast('スピーカーを選んでください');
  try{toast('送信中…');await api('play',{method:'POST',body:{device:dev(),file:name,loop:$('loop').checked,volume:$('vol').value/100,minutes:Number($('tmr').value)}});
    $('now').textContent='▶ '+name;toast('再生開始')}catch(e){toast(e.message)}
}
const ctl=(p,msg)=>async()=>{try{await api(p,{method:'POST',body:{device:dev()}});if(msg)$('now').textContent=msg}catch(e){toast(e.message)}};
$('pause').onclick=ctl('pause','⏸ 一時停止中');$('resume').onclick=ctl('resume');$('stop').onclick=ctl('stop','停止中');
let vt;$('vol').oninput=()=>{$('vl').textContent=$('vol').value;clearTimeout(vt);
  vt=setTimeout(()=>api('volume',{method:'POST',body:{device:dev(),level:$('vol').value/100}}).catch(e=>toast(e.message)),250)};
$('upbtn').onclick=async()=>{
  const fs=$('up').files;if(!fs.length)return toast('ファイルを選んでください');
  const fd=new FormData();[...fs].forEach(f=>fd.append('files',f));
  try{toast('アップロード中…');await api('upload',{method:'POST',body:fd});$('up').value='';toast('追加しました');loadFiles()}catch(e){toast(e.message)}
};
async function init(){try{await loadDevices();await loadFiles()}catch(e){toast(e.message)}}
init();setInterval(()=>loadDevices().catch(()=>{}),20000);
</script></body></html>
