name: TiltBallWatch
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "10.0"
targets:
  TiltBallWatch:
    type: application
    platform: watchOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tiltballwatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BallClock
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_NSMotionUsageDescription: 手首の傾きでボールを転がすために使います。
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
